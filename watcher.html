function debounce(func, timeout = 300){

  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => { func.apply(this, args); }, timeout);
  };
}

function arabicToThai(number) {
  const thaiNumerals = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
  return number.toString().replace(/[0-9]/g, function(digit) {
    return thaiNumerals[parseInt(digit)];
  });
}

async function loadLzmaJson(url) {
  const resp = await fetch(url);
  const arrayBuffer = await resp.arrayBuffer();
  const compressed = new Uint8Array(arrayBuffer);
  return new Promise((resolve, reject) => {
    LZMA.decompress(compressed, (result, error) => {
      if (error) {
        reject(error);
      } else {
        resolve(JSON.parse(result));
      }
    });
  });
}

async function loadGzippedJson(url) {
  const response = await fetch(url);
  const compressedData = await response.arrayBuffer();
  const ds = new DecompressionStream('gzip');
  const decompressedStream = new Response(compressedData).body.pipeThrough(ds);
  const result = await new Response(decompressedStream).json();
  return result;
}

async function loadZippedJson(url) {
  const resp = await fetch(url);
  const buffer = await resp.arrayBuffer();
  const zipped = new Uint8Array(buffer);
  const unzipped = fflate.unzipSync(zipped); // unzip all files
  const fileNames = Object.keys(unzipped);
  const json = JSON.parse(new TextDecoder().decode(unzipped[fileNames[0]]));
  return json;
}

      if (typeof value === "string") {
        value = value.replace(/(\[.*?\])/g,'<span style="color:red;">$1</span>');
        value = value.replace(/(\(.*?\))/g,'<span style="color:blue;">$1</span>');
        value = value.replace(/(\{.*?\})/g,'<span style="color:green;">$1</span>');

  }
}

function filterTable(id,val){//console.log(id,val)
  filterValue = val
  if(val===''){filterValue = "",tables[id].clearFilter(),tables[id].redraw(true)}
  if(Number.isInteger(parseInt(val))&&!val.includes(':')){tables[id].setPage(val)}
  if(typeof val === "string" && !Number.isInteger(parseInt(val))) {
    filterValue=val
    tables[id].setFilter([{field:"content",type:"like",value:val}])
  }
  if(val.includes('/')){val=val.split('/')
    if(/^[1-9]$/.test(val[0])){val[0]='0'+val[0]}

    tables[id].setFilter([ 
      {field:"volume",type:"=",value:val[0]},
      {field:"items",type:"like",value:val[1]}, 
    ])
  }
  
  tables[id].redraw(true)
  
  tables[id].on("dataFiltered", function(filters, rows){
    matchCount = 0 //reset
    filters.forEach(filter => {if(filter.field === "content") {filterValue = filter.value}})
    rows.forEach(row => {
      let data = row.getData();
      if (data.content && filterValue) {
        let re = new RegExp(`${filterValue}`, "gi");
        let matches = (data.content.match(re) || []).length;
        matchCount += matches;
      }
    })  //console.log("Total matches:", matchCount);
    tables[id].redraw(true)
  })
  updateHeaderTitle(id)
}

function updateHeaderTitle(id) {
  if (!tables[id]) return;
  const currentPage = tables[id].getPage()
  const currentData = tables[id].getData("active")[currentPage - 1];
  if (!currentData) return;
  
  const originalTitle = tables[id].options.columns[0].title;
  const volume = parseInt(currentData.volume) || 0;

  let volumeName;
  const filteredTableHead = tableHead[id].filter(v => !(v.includes('{') || v.includes('!')));
  
  if (currentData.volume === 0) {
	if(currentData.content.includes("สารบัญ")){volumeName = "สารบัญ"}
	if(currentData.content.includes("อภิธานศัพท์")){volumeName = "อภิธานศัพท์"}
  } 
  else {volumeName = filteredTableHead[volume-1] || tableHead[id][volume-1]}
  
  const page = parseInt(currentData.page) || 0;
  const pageThai = arabicToThai(page)
  const items = currentData.items !== undefined && currentData.items !== null 
    ? currentData.items : 0;

//	if(item.text.length>50){item.text=item.text.substring(0, 50)+"..."}
  const newTitle = `<div style="text-align:center;line-height:1.2;">
	<div>${originalTitle}</div>
	<small style="font-size:0.90rem;">
	  ${volumeName}. / ${pageThai}
	</small>
  </div>`;
  tables[id].updateColumnDefinition("content",{title:newTitle,titleFormatter:"html"});
}

function createTOCContent(volumes,tableId,itemsPerPage=35) {
  if (!volumes) return [];
  let tocItems=[],itemCounter=0,headCounter=0,currentHeader=null;
  // First process all volumes to extract items and headers
  const processedItems = [];
  volumes.forEach((volume, index) => {
    const isHeader = volume.includes('{') || volume.includes('!');
    if (isHeader) {headCounter++; currentHeader={type:'header',text:volume.replace(/{|}|!/g,'')};processedItems.push(currentHeader)} 
    else {itemCounter++; processedItems.push({type:'item',text:volume,index:index+1-headCounter,itemNumber:itemCounter,header:currentHeader})}
  });
  // Now split into pages
  const tocPages = [];
  let currentPageItems=[],currentItemCount=0,pageNumber=0,lastHeader=null;

  processedItems.forEach(item => {
    if(item.type==='header'){lastHeader = item;} 
    else{currentItemCount++;
      if (currentItemCount > itemsPerPage) {
        tocPages.push(createTOCPage(currentPageItems,pageNumber,tableId));
        currentPageItems = [];
        if (item.header) {currentPageItems.push(item.header)}
        currentItemCount = 1;pageNumber++;
      }
    }
    if (item.type==='item' && item.header && item.header !== lastHeader){currentPageItems.push(item.header);lastHeader=item.header}
    currentPageItems.push(item);
  });
  // Add the last page if it has content
  if(currentPageItems.length>0){tocPages.push(createTOCPage(currentPageItems, pageNumber,tableId))}
  return tocPages;
}

function createTOCPage(items, pageNumber, tableId) {
  let tocHTML = `<div><a style="display:none">สารบัญ</a>
  <div class="column-2"><ul class="no-style">`;

  const seenHeaders = new Set(); 


  items.forEach(item => {
    if (item.type === 'header') {
      if (!seenHeaders.has(item.text)) {
        tocHTML += `<h3>${item.text}</h3>`;
        seenHeaders.add(item.text);
    }} 
    else { 
		tocHTML += `
<li class="li-style">
    <a href="#" onclick="event.preventDefault();goToVolumeFromTOC(${item.index},${tableId})" 
    class="text-blue text-red number-${String(item.itemNumber).length}">
        ${item.itemNumber}. ${item.text}
    </a>
</li>
        `;
    }
  });
  tocHTML += `</ul></div>`;
  
  return {volume:0,page:pageNumber,item:"",content: tocHTML}
}

function goToVolumeFromTOC(volume, tableId) {
  if (!tables[tableId]) return;
  const allData = tables[tableId].getData();
  for (let i=0;i<allData.length;i++) {
    const row = allData[i];
    if (row.volume === volume) {
      const scrollPos = tables[tableId].element.scrollTop;
      tables[tableId].setPage(i+1);
      updateHeaderTitle(tableId);
	  setTimeout(() => {tables[tableId].element.scrollTop = scrollPos;}, 50);
      return;
    }
  }

  console.warn("Could not find volume", volume);
}

function createGlossaryContent(tableId, itemsPerPage=60) {
  const glossaryTerms = index.term.sort(()=>0.5-Math.random()).slice(0,500);
  if (!glossaryTerms || glossaryTerms.length === 0) return [];
  
  // Group terms by first letter
  const groupedTerms = {};
  glossaryTerms.forEach(term => {
    const firstLetter = term.charAt(0).toUpperCase();
    if (!groupedTerms[firstLetter]) {groupedTerms[firstLetter] = []}
    groupedTerms[firstLetter].push(term);
  });

  // Sort letters and prepare all items
  const letters = Object.keys(groupedTerms).sort();
  const allItems = [];
  
  letters.forEach(letter => {
    allItems.push({type: 'header', text: letter});
    groupedTerms[letter].forEach(term => {
      allItems.push({type: 'term', text: term});
    });
  });

  // Split into pages
  const glossaryPages = [];
  let currentPageItems = [];
  let currentItemCount = 0;
  let pageNumber = 0;
  let lastHeader = null;

  allItems.forEach(item => {
    if (item.type === 'header') {
      lastHeader = item;
      // If adding this header would exceed the page, create a new page first
      if (currentItemCount >= itemsPerPage) {
        glossaryPages.push(createGlossaryPage(currentPageItems, pageNumber, tableId));
        currentPageItems = [], currentItemCount = 0, pageNumber++;
      }
    } else {
      currentItemCount++;
      // If adding this term would exceed the page, create a new page
      if (currentItemCount > itemsPerPage) {
        glossaryPages.push(createGlossaryPage(currentPageItems, pageNumber, tableId));
        currentPageItems = [];
        if (lastHeader) currentPageItems.push(lastHeader);
        currentItemCount = 1, pageNumber++;
      }
    }
    currentPageItems.push(item);
  });

  // Add the last page if it has content
  if (currentPageItems.length > 0) {
    glossaryPages.push(createGlossaryPage(currentPageItems, pageNumber, tableId));
  }

  return glossaryPages;
}

function createGlossaryPage(items, pageNumber, tableId) {
  let glossaryHTML = `<div"><a style="display:none">อภิธานศัพท์</a>
  <div class="column-3"><ul class="no-style">`;

  const seenHeaders = new Set(); // Track headers to avoid duplicates

  items.forEach(item => {
    if (item.type === 'header') {
      if (!seenHeaders.has(item.text)) {
        glossaryHTML += `<h3>${item.text}</h3>`;
        seenHeaders.add(item.text);
      }
    } else if (item.type === 'term') {
      glossaryHTML += `<li style="margin-bottom:5px;">
        <a href="#" onclick="event.preventDefault();filterTable(${tableId},'${item.text}')" 
           class="text-blue text-red"> ${item.text} </a></li>`;
    }
  });

  glossaryHTML += `</ul></div>`;

  return {volume:0,page:pageNumber,items:"",content:glossaryHTML}
}
